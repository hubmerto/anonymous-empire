<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire · Pile</title>
<meta name="theme-color" content="transparent">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #fff;
    }
    body { min-height: 100dvh; position: relative; }

    .back-link {
        position: fixed;
        top: 18px;
        left: 20px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        opacity: 0.35;
        text-decoration: none;
        z-index: 9999;
        transition: opacity 0.2s ease;
    }
    .back-link:hover { opacity: 1; }

    .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
    }

    /* The pile is a centred frame. Cards land randomly inside it. */
    .pile {
        position: relative;
        width: min(85vmin, 820px);
        height: min(85vmin, 820px);
        overflow: hidden;
    }

    .card {
        position: absolute;
        top: 50%;
        left: 50%;
        filter: grayscale(1) contrast(1.05);
        transform: translate(-50%, -50%);
        will-change: opacity, transform;
        pointer-events: none;
        user-select: none;
        display: block;
        opacity: 1;
        transition: none;
    }
    .card.fade {
        transition: opacity 0.5s ease;
        opacity: 0;
    }

    /* Native aspect ratios — landscape and portrait keep their own proportions */
    .card.is-landscape { aspect-ratio: 5 / 4; }
    .card.is-portrait  { aspect-ratio: 4 / 5; }

    @media (prefers-reduced-motion: reduce) {
        .card { transition: none !important; animation: none !important; }
    }
</style>
</head>
<body>
    <a class="back-link" href="../../">Back</a>
    <div class="stage">
        <div class="pile" id="pile" role="img" aria-label="Continuously growing pile of 21 scene photographs"></div>
    </div>

    <script>
    (function(){
        var BASE = '../../Scenes_Photogrpahs/';
        var FILES = [
            { file: 'Amsterdam.png',  o: 'l' },
            { file: 'Berlin.png',     o: 'l' },
            { file: 'Birmingham.png', o: 'p' },
            { file: 'Brussels.png',   o: 'p' },
            { file: 'Chicago.png',    o: 'l' },
            { file: 'Cologne.png',    o: 'l' },
            { file: 'Copenhagen.png', o: 'p' },
            { file: 'Detroit.png',    o: 'l' },
            { file: 'Frankfurt.png',  o: 'p' },
            { file: 'Glasgow.png',    o: 'p' },
            { file: 'Kyiv.png',       o: 'l' },
            { file: 'Leipzig.png',    o: 'p' },
            { file: 'London.png',     o: 'p' },
            { file: 'Madrid.png',     o: 'l' },
            { file: 'Munich.png',     o: 'p' },
            { file: 'Rome.png',       o: 'l' },
            { file: 'Sao Paulo.png',  o: 'l' },
            { file: 'Sheffield.png',  o: 'p' },
            { file: 'Stockholm.png',  o: 'l' },
            { file: 'Tbilisi.png',    o: 'p' },
            { file: 'Tokyo.png',      o: 'p' },
        ];
        var pile = document.getElementById('pile');

        // Shuffle so every reload starts in a different order
        for (var i = FILES.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = FILES[i]; FILES[i] = FILES[j]; FILES[j] = tmp;
        }

        // Preload all 21 images so the first cycle isn't jittery
        var loaded = 0;
        FILES.forEach(function(f){
            var im = new Image();
            im.onload = im.onerror = function(){ loaded++; };
            im.src = BASE + encodeURIComponent(f.file);
        });

        var INTERVAL = 300;     // ms between new cards landing
        var LIFETIME = 4000;    // ms each card stays before fading
        var FADE     = 500;     // ms of fade-out
        var idx = 0;
        var z = 1;

        function addCard(){
            var info = FILES[idx % FILES.length];
            idx++;
            var img = document.createElement('img');
            img.className = 'card ' + (info.o === 'l' ? 'is-landscape' : 'is-portrait');
            img.src = BASE + encodeURIComponent(info.file);
            img.alt = '';
            img.draggable = false;

            // Same base size for every card (matches original about-pile)
            var scaleMul = 0.88 + Math.random() * 0.24;       // 0.88 – 1.12
            var widthPct = 35 * scaleMul;
            img.style.width = widthPct + '%';
            img.style.height = 'auto';

            // Random offset constrained so the card stays inside the frame
            var rect = pile.getBoundingClientRect();
            var coverPx = rect.width * (widthPct / 100);
            var coverHpx = info.o === 'l' ? coverPx * 0.8 : coverPx * 1.25;
            var maxDxPct = rect.width  ? ((rect.width  - coverPx)  / 2) / rect.width  * 100 : 15;
            var maxDyPct = rect.height ? ((rect.height - coverHpx) / 2) / rect.height * 100 : 15;
            maxDxPct = Math.max(0, maxDxPct - 2);
            maxDyPct = Math.max(0, maxDyPct - 2);
            var dx = (Math.random() - 0.5) * 2 * maxDxPct;
            var dy = (Math.random() - 0.5) * 2 * maxDyPct;
            var rot = (Math.random() - 0.5) * 10; // ±5°
            img.style.left = 'calc(50% + ' + dx.toFixed(2) + '%)';
            img.style.top  = 'calc(50% + ' + dy.toFixed(2) + '%)';
            img.style.transform = 'translate(-50%, -50%) rotate(' + rot.toFixed(2) + 'deg)';
            img.style.zIndex = String(z++);

            pile.appendChild(img);

            // Lifetime: fade then remove
            setTimeout(function(){
                img.classList.add('fade');
                setTimeout(function(){
                    if (img.parentNode) img.parentNode.removeChild(img);
                }, FADE);
            }, LIFETIME);
        }

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduced){
            // Wait briefly so most images decode before the first land
            setTimeout(function tick(){
                addCard();
                setTimeout(tick, INTERVAL);
            }, 250);
        } else {
            // Static: paint the deck once with all 21 in a single layer
            FILES.forEach(function(){ addCard(); });
        }
    })();
    </script>
</body>
</html>
