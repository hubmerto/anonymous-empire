<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire · Browser window</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #fff;
    }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 0; }

    /* Outer browser-window frame ------------------------------------- */
    .window {
        --chrome-h: 52px;     /* matches the SVG's intrinsic height */
        --bar-h:    36px;     /* URL pill height inside the chrome */
        width: 100%;
        max-width: 100%;
        aspect-ratio: auto;
        height: 100dvh;
        position: relative;
        background: #0a0a0a;
        border-radius: 0;
        overflow: hidden;
    }

    .chrome {
        position: relative;
        height: var(--chrome-h);
        width: 100%;
        background: #191C1F;
        flex-shrink: 0;
    }
    .chrome img.toolbar-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
    }

    /* iframe stage -------------------------------------------------- */
    .stage {
        position: absolute;
        top: var(--chrome-h);
        left: 0;
        right: 0;
        bottom: 0;
        background: #0a0a0a;
    }
    .stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #0a0a0a;
        scrollbar-width: none;        /* Firefox */
        pointer-events: none;         /* iframe reads as a still — nav doesn't navigate */
        user-select: none;
    }
    .stage iframe::-webkit-scrollbar { display: none; }  /* WebKit */
    body, html { scrollbar-width: none; }
    body::-webkit-scrollbar, html::-webkit-scrollbar { display: none; }

    /* Tiny back link, mirrors the other animation pages */
    .back-link {
        position: fixed;
        top: 18px;
        left: 20px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        opacity: 0.35;
        text-decoration: none;
        z-index: 9999;
        transition: opacity 0.2s ease;
    }
    .back-link:hover { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
        }
    @media (max-width: 720px) {
        body { padding: 0; }
        .window { border-radius: 0; }
        }
</style>
</head>
<body>
    <a class="back-link" href="../../">Back</a>

    <div class="window">
        <div class="chrome">
            <img class="toolbar-bg" src="toolbar.svg" alt="">
        </div>
        <div class="stage">
            <iframe
                id="frame"
                src="../../?only=hero"
                title="Anonymous Empire — Hero"
                loading="lazy"
                allow="autoplay"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
    </div>

    <script>
    (function(){
        // ── URL params ───────────────────────────────────────────────
        // ?section=hero        loads /?only=hero        → URL "anonymousempire.art"
        // ?section=scenes      loads /?only=scenes      → URL "anonymousempire.art/#scenes"
        // ?section=library     loads /library/          → URL "anonymousempire.art/library"
        // ?section=deck        loads /animations/deck/  → URL "anonymousempire.art/animations/deck"
        // ?section=ppi         loads /poverty-politics-industry/
        // ?url=…&src=…         override either field directly
        var params = new URLSearchParams(location.search);
        var section = params.get('section') || 'hero';
        var presets = {
            hero:        { src: '../../?only=hero' },
            scenes:      { src: '../../?only=scenes' },
            ppi:         { src: '../../poverty-politics-industry/' },
            essays:      { src: '../../?only=ppi-essays' },
            scarcity:    { src: '../../scarcity-refusal-ruin/' },
            about:       { src: '../../?only=about-section' },
            library:     { src: '../../library/' },
            deck:        { src: '../../animations/deck/' },
        };
        var preset = presets[section] || presets.hero;
        var src = params.get('src') || preset.src;

        document.getElementById('frame').src = src;

    })();
    </script>
</body>
</html>
