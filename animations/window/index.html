<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire · Browser window</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #fff;
    }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 0; }

    /* Outer browser-window frame ------------------------------------- */
    .window {
        --chrome-h: 52px;     /* matches the SVG's intrinsic height */
        --bar-h:    36px;     /* URL pill height inside the chrome */
        width: 100%;
        max-width: 100%;
        aspect-ratio: auto;
        height: 100dvh;
        position: relative;
        background: #0a0a0a;
        border-radius: 0;
        overflow: hidden;
    }

    .chrome {
        position: relative;
        height: var(--chrome-h);
        width: 100%;
        background: #191C1F;
        flex-shrink: 0;
    }
    .chrome img.toolbar-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
    }

    /* iframe stage -------------------------------------------------- */
    .stage {
        position: absolute;
        top: var(--chrome-h);
        left: 0;
        right: 0;
        bottom: 0;
        background: #0a0a0a;
    }
    .stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #0a0a0a;
        scrollbar-width: none;        /* Firefox */
        pointer-events: none;         /* iframe reads as a still — nav doesn't navigate */
        user-select: none;
    }
    .stage iframe::-webkit-scrollbar { display: none; }  /* WebKit */
    body, html { scrollbar-width: none; }
    body::-webkit-scrollbar, html::-webkit-scrollbar { display: none; }

    /* Tiny back link, mirrors the other animation pages */

    @media (prefers-reduced-motion: reduce) {
        }
    @media (max-width: 720px) {
        body { padding: 0; }
        .window { border-radius: 0; }
        }
    /* ── iPhone-frame mode (?device=iphone) ───────────────────────── */
    body.iphone .window {
        height: auto;
        width: auto;
        max-width: none;
        max-height: 100dvh;
        aspect-ratio: 9 / 19.5;
        background: #0a0a0a;
        border-radius: 60px;
        padding: 14px;
        box-shadow:
            0 0 0 1.5px #2a2a2a,
            0 30px 80px rgba(0,0,0,0.6);
        overflow: hidden;
        position: relative;
        --device-h: 100dvh;
    }
    body.iphone .window::before {
        /* Dynamic island */
        content: '';
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 36%;
        max-width: 130px;
        height: 32px;
        background: #000;
        border-radius: 999px;
        z-index: 5;
    }
    body.iphone .chrome { display: none; }
    body.iphone .stage {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        bottom: 14px;
        border-radius: 48px;
        overflow: hidden;
    }
    body.iphone .stage iframe {
        border-radius: inherit;
    }
    @media (max-width: 540px) {
        body.iphone .window {
            border-radius: 44px;
            padding: 10px;
        }
        body.iphone .window::before {
            top: 18px;
            width: 38%;
            height: 26px;
        }
        body.iphone .stage {
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border-radius: 36px;
        }
    }
</style>
</head>
<body>
    <div class="window">
        <div class="chrome">
            <img class="toolbar-bg" src="toolbar.svg" alt="">
        </div>
        <div class="stage">
            <iframe
                id="frame"
                src="../../?only=hero"
                title="Anonymous Empire — Hero"
                loading="lazy"
                allow="autoplay"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
    </div>

    <script>
    (function(){
        // ── URL params ───────────────────────────────────────────────
        // ?section=hero        loads /?only=hero        → URL "anonymousempire.art"
        // ?section=scenes      loads /?only=scenes      → URL "anonymousempire.art/#scenes"
        // ?section=library     loads /library/          → URL "anonymousempire.art/library"
        // ?section=deck        loads /animations/deck/  → URL "anonymousempire.art/animations/deck"
        // ?section=ppi         loads /poverty-politics-industry/
        // ?url=…&src=…         override either field directly
        var params = new URLSearchParams(location.search);
        var section = params.get('section') || 'hero';
        var device  = params.get('device');
        if (device === 'iphone' || device === 'mobile') {
            document.body.classList.add('iphone');
        }
        var presets = {
            hero:        { src: '../../?only=hero' },
            scenes:      { src: '../../?only=scenes&hide=.scenes-intro' },
            ppi:         { src: '../../poverty-politics-industry/' },
            essays:      { src: '../../?only=ppi-essays' },
            scarcity:    { src: '../../scarcity-refusal-ruin/' },
            about:       { src: '../../?only=about-section' },
            library:     { src: '../../library/' },
            grid:        { src: '../../library/#grid' },
            timeline:    { src: '../../library/#timeline' },
            map:         { src: '../../library/#map' },
            colour:      { src: '../../library/#color' },
            deck:        { src: '../../animations/deck/' },
        };
        var preset = presets[section] || presets.hero;
        var src = params.get('src') || preset.src;

        document.getElementById('frame').src = src;

    })();
    </script>
</body>
</html>
