<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire · Browser window</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #fff;
    }
    body { display: grid; place-items: center; min-height: 100dvh; padding: 1.5rem; }

    /* Outer browser-window frame ------------------------------------- */
    .window {
        --chrome-h: 52px;     /* matches the SVG's intrinsic height */
        --bar-h:    36px;     /* URL pill height inside the chrome */
        width: 100%;
        max-width: 1280px;
        aspect-ratio: 1280 / 800;
        position: relative;
        background: #0a0a0a;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .chrome {
        position: relative;
        height: var(--chrome-h);
        width: 100%;
        background: #191C1F;
        flex-shrink: 0;
    }
    .chrome img.toolbar-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
    }

    /* URL pill — overlaid on top of the toolbar SVG, in the search-bar
       area of the chrome. The animated-typing URL renders here. */
    .url-pill {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 56%;
        max-width: 720px;
        height: var(--bar-h);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        color: #cfd1d4;
        letter-spacing: 0.005em;
        white-space: nowrap;
        pointer-events: none;
    }
    .url-pill svg.lock {
        width: 12px;
        height: 12px;
        opacity: 0.55;
        flex-shrink: 0;
    }
    .url-pill .url-text {
        display: inline-block;
        min-width: 1ch;
    }
    .url-pill .url-text::after {
        content: '|';
        display: inline-block;
        margin-left: 1px;
        color: #fff;
        opacity: 0;
        animation: caret 1s steps(1, end) infinite;
    }
    .url-pill.typed .url-text::after { animation: none; opacity: 0; }
    @keyframes caret { 50% { opacity: 0.8; } }

    /* iframe stage -------------------------------------------------- */
    .stage {
        position: absolute;
        top: var(--chrome-h);
        left: 0;
        right: 0;
        bottom: 0;
        background: #0a0a0a;
    }
    .stage iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #0a0a0a;
    }

    /* Tiny back link, mirrors the other animation pages */
    .back-link {
        position: fixed;
        top: 18px;
        left: 20px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        opacity: 0.35;
        text-decoration: none;
        z-index: 9999;
        transition: opacity 0.2s ease;
    }
    .back-link:hover { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
        .url-pill .url-text::after { animation: none; opacity: 0; }
    }
    @media (max-width: 720px) {
        body { padding: 0.5rem; }
        .window { border-radius: 8px; }
        .url-pill { font-size: 11px; width: 70%; }
    }
</style>
</head>
<body>
    <a class="back-link" href="../../">Back</a>

    <div class="window">
        <div class="chrome">
            <img class="toolbar-bg" src="toolbar.svg" alt="">
            <div class="url-pill" id="urlPill">
                <svg class="lock" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V7H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-.5V4.5A3.5 3.5 0 0 0 8 1zm-2 6V4.5a2 2 0 1 1 4 0V7H6z"/>
                </svg>
                <span class="url-text" id="urlText"></span>
            </div>
        </div>
        <div class="stage">
            <iframe
                id="frame"
                src="../../?only=hero"
                title="Anonymous Empire — Hero"
                loading="lazy"
                allow="autoplay"
                referrerpolicy="no-referrer">
            </iframe>
        </div>
    </div>

    <script>
    (function(){
        // ── URL params ───────────────────────────────────────────────
        // ?section=hero        loads /?only=hero        → URL "anonymousempire.art"
        // ?section=scenes      loads /?only=scenes      → URL "anonymousempire.art/#scenes"
        // ?section=library     loads /library/          → URL "anonymousempire.art/library"
        // ?section=deck        loads /animations/deck/  → URL "anonymousempire.art/animations/deck"
        // ?section=ppi         loads /poverty-politics-industry/
        // ?url=…&src=…         override either field directly
        var params = new URLSearchParams(location.search);
        var section = params.get('section') || 'hero';
        var presets = {
            hero:        { src: '../../?only=hero',         url: 'anonymousempire.art' },
            scenes:      { src: '../../?only=scenes',       url: 'anonymousempire.art/#scenes' },
            ppi:         { src: '../../poverty-politics-industry/', url: 'anonymousempire.art/poverty-politics-industry' },
            essays:      { src: '../../?only=ppi-essays',   url: 'anonymousempire.art/#essays' },
            scarcity:    { src: '../../scarcity-refusal-ruin/', url: 'anonymousempire.art/scarcity-refusal-ruin' },
            about:       { src: '../../?only=about-section', url: 'anonymousempire.art/#about' },
            library:     { src: '../../library/',           url: 'anonymousempire.art/library' },
            deck:        { src: '../../animations/deck/',   url: 'anonymousempire.art/animations/deck' },
        };
        var preset = presets[section] || presets.hero;
        var src = params.get('src') || preset.src;
        var url = params.get('url') || preset.url;

        document.getElementById('frame').src = src;

        // ── Typed URL ────────────────────────────────────────────────
        var prefix = 'https://';
        var full = prefix + url;
        var el  = document.getElementById('urlText');
        var pill = document.getElementById('urlPill');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
            el.textContent = full;
            pill.classList.add('typed');
            return;
        }
        var i = 0;
        function tick(){
            i++;
            el.textContent = full.slice(0, i);
            if (i < full.length) {
                setTimeout(tick, 38 + Math.random() * 32);
            } else {
                setTimeout(function(){ pill.classList.add('typed'); }, 600);
            }
        }
        setTimeout(tick, 450);
    })();
    </script>
</body>
</html>
