<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire · Vectorscope</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        height: 100%;
        background: #000;
        color: #cfcfcf;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        overflow: hidden;
    }
    body { min-height: 100dvh; display: grid; place-items: center; }

    .scope-wrap {
        position: relative;
        width: min(90vmin, 800px);
        height: min(90vmin, 800px);
    }
    .scope-wrap svg { width: 100%; height: 100%; display: block; }
    .scope-grid line, .scope-grid circle {
        stroke: #232323;
        stroke-width: 1;
        fill: none;
    }
    .scope-grid circle.threshold {
        stroke: #404040;
        stroke-dasharray: 2 4;
    }
</style>
</head>
<body>
    <div class="scope-wrap">
        <svg id="scope" viewBox="-110 -110 220 220" xmlns="http://www.w3.org/2000/svg">
            <g class="scope-grid" id="grid"></g>
            <g id="dots"></g>
        </svg>
    </div>

    <script>
    (async function(){
        var dotsLayer   = document.getElementById('dots');
        var gridLayer   = document.getElementById('grid');

        function svg(name, attrs){
            var el = document.createElementNS('http://www.w3.org/2000/svg', name);
            for (var k in attrs) el.setAttribute(k, attrs[k]);
            return el;
        }

        var R = 100;
        [25, 50, 75, 100].forEach(function(r){
            gridLayer.appendChild(svg('circle', { cx: 0, cy: 0, r: r }));
        });
        var THR = 22;
        var thr = svg('circle', { cx: 0, cy: 0, r: (THR/100)*R });
        thr.classList.add('threshold');
        gridLayer.appendChild(thr);

        var BUCKETS = [0,30,60,90,130,170,195,225,255,285,315,340];
        function hueXY(h, r){
            var rad = h * Math.PI / 180;
            return { x: r * Math.cos(rad), y: -r * Math.sin(rad) };
        }
        BUCKETS.forEach(function(h){
            var p = hueXY(h, R);
            gridLayer.appendChild(svg('line', { x1: 0, y1: 0, x2: p.x.toFixed(2), y2: p.y.toFixed(2) }));
        });

        var releases = [];
        try {
            var r = await fetch('../../data/releases.json?cb=' + Date.now());
            var d = await r.json();
            releases = d.releases;
        } catch(e){}
        if (!releases.length) return;

        function analyze(rec){
            var palette = Array.isArray(rec.palette) ? rec.palette : [];
            var primary = rec.hsl || {};
            var sumX = 0, sumY = 0, sumW = 0, chromaTotal = 0, totalFrac = 0, lightAvg = 0;
            palette.forEach(function(p){
                var c = typeof p.c === 'number' ? p.c : 0;
                var f = typeof p.frac === 'number' ? p.frac : 0;
                var w = c * f;
                var hRad = (p.h || 0) * Math.PI / 180;
                sumX += Math.cos(hRad) * w;
                sumY += Math.sin(hRad) * w;
                sumW += w;
                chromaTotal += c * f;
                totalFrac += f;
                lightAvg += (p.l || 0) * f;
            });
            var l = totalFrac > 0 ? lightAvg / totalFrac : (primary.l || 0);
            var hue = 0;
            if (sumW > 0.001) {
                hue = Math.atan2(sumY, sumX) * 180 / Math.PI;
                if (hue < 0) hue += 360;
            } else if (typeof primary.h === 'number') {
                hue = primary.h;
            }
            var chroma = totalFrac > 0 ? chromaTotal / totalFrac : 0;
            return { hue: hue, chroma: chroma, l: l, hex: primary.hex || '#888' };
        }

        var meta = releases.map(function(rec){
            var a = analyze(rec);
            return a;
        });

        // Build dots with a staggered fade-in
        var dotSpecs = [];
        meta.forEach(function(m, i){
            var pos = hueXY(m.hue, Math.min(m.chroma, 100) / 100 * R);
            var c = svg('circle', {
                cx: pos.x.toFixed(2),
                cy: pos.y.toFixed(2),
                r: 1.4,
                fill: m.hex,
                opacity: 0,
            });
            dotsLayer.appendChild(c);
            dotSpecs.push({
                el: c,
                tx: pos.x,
                ty: pos.y,
                phase: Math.random() * Math.PI * 2,
                wobble: 0.15 + Math.random() * 0.45,
                appear: i * 6 + Math.random() * 80
            });
        });

        // Sweep beam — radar-style rotating line that boosts dots it passes
        var beam = svg('line', {
            x1: 0, y1: 0, x2: R, y2: 0,
            stroke: '#cfcfcf',
            'stroke-width': 0.6,
            opacity: 0.18
        });
        gridLayer.appendChild(beam);

        var t0 = performance.now();
        function tick(now){
            var t = now - t0;
            var sweep = (t / 5500) * Math.PI * 2; // full rotation every 5.5s
            beam.setAttribute('transform', 'rotate(' + (-sweep * 180 / Math.PI).toFixed(2) + ')');

            for (var i = 0; i < dotSpecs.length; i++){
                var d = dotSpecs[i];
                // Fade in
                var ageMs = t - d.appear;
                var fade = ageMs <= 0 ? 0 : Math.min(1, ageMs / 400);

                // Subtle signal jitter
                var ox = Math.sin(t * 0.002 + d.phase) * d.wobble;
                var oy = Math.cos(t * 0.0017 + d.phase * 1.7) * d.wobble;

                // Beam highlight: brighter when sweep angle ≈ dot angle
                var angle = Math.atan2(-d.ty, d.tx);
                if (angle < 0) angle += Math.PI * 2;
                var sweepNorm = sweep % (Math.PI * 2);
                var diff = Math.abs(((angle - sweepNorm + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
                var glow = Math.max(0, 1 - diff / 0.35);

                d.el.setAttribute('cx', (d.tx + ox).toFixed(2));
                d.el.setAttribute('cy', (d.ty + oy).toFixed(2));
                d.el.setAttribute('opacity', (fade * (0.5 + glow * 0.5)).toFixed(3));
                d.el.setAttribute('r', (1.4 + glow * 1.2).toFixed(2));
            }

            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

    })();
    </script>
</body>
</html>
