const SVGNS = 'http://www.w3.org/2000/svg';
function buildWordSvg(i) {
  const w = WORDS[i];
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', w.vb);
  svg.setAttribute('preserveAspectRatio', 'none');
  for (const d of w.paths) {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  }
  return svg;
}
const wordSvgs = [0,1,2].map(buildWordSvg);
let zoneWord = [0, 1, 2]; // A=POVERTY, B=POLITICS, C=INDUSTRY
const zoneEls = [document.getElementById('wA'), document.getElementById('wB'), document.getElementById('wC')];
function renderAssignment() {
  for (let z = 0; z < 3; z++) {
    while (zoneEls[z].firstChild) zoneEls[z].removeChild(zoneEls[z].firstChild);
    zoneEls[z].appendChild(wordSvgs[zoneWord[z]]);
  }
}
renderAssignment();

function isDesktop() { return innerWidth >= innerHeight; }
function layoutDesktop(X, Y) {
  const W = innerWidth, H = innerHeight;
  const xw = X * W, yh = Y * H;
  return {
    A: { L:0,  T:0,  W:xw,   H:yh   },
    B: { L:0,  T:yh, W:xw,   H:H-yh },
    C: { L:xw, T:0,  W:W-xw, H:H    }
  };
}
function layoutMobile(X, Y) {
  const W = innerWidth, H = innerHeight;
  const xw = X * W, yh = Y * H;
  return {
    C: { L:0,  T:0,  W:W,    H:yh   },
    A: { L:0,  T:yh, W:xw,   H:H-yh },
    B: { L:xw, T:yh, W:W-xw, H:H-yh }
  };
}
function applyLayout(zones) {
  const keys = ['A','B','C'];
  for (let i = 0; i < 3; i++) {
    const r = zones[keys[i]];
    const el = zoneEls[i];
    el.style.left   = r.L + 'px';
    el.style.top    = r.T + 'px';
    el.style.width  = Math.max(0, r.W) + 'px';
    el.style.height = Math.max(0, r.H) + 'px';
  }
}

function mkSpring(pos){ return { pos, vel:0, target:pos, omega:9, zeta:0.58 }; }
function stepSpring(s, dt) {
  dt = Math.min(dt, 0.05);
  const accel = -2 * s.zeta * s.omega * s.vel - s.omega * s.omega * (s.pos - s.target);
  s.vel += accel * dt;
  s.pos += s.vel * dt;
}
function setSpring(s, target, omega, zeta) { s.target = target; s.omega = omega; s.zeta = zeta; }

const PEAKS_DESKTOP = [
  { X:0.34, Y:0.13 },
  { X:0.32, Y:0.11 },
  { X:0.36, Y:0.14 },
];
const PEAKS_MOBILE = [
  { X:0.50, Y:0.85 },
  { X:0.50, Y:0.87 },
  { X:0.50, Y:0.86 },
];
function currentPeaks() { return isDesktop() ? PEAKS_DESKTOP : PEAKS_MOBILE; }

const HOLD_DUR = 2.0;
const OE = 9, ZE = 0.58;
const OC = 18, ZC = 0.92;
const S1_MID = 0.35;

let phase = 'HOLD';
let phaseT = 0;
let stateIdx = 0;
let lastDesktop = isDesktop();

const initPeak = currentPeaks()[0];
const sX = mkSpring(initPeak.X);
const sY = mkSpring(initPeak.Y);

function spring1() { return isDesktop() ? sY : sX; }
function spring2() { return isDesktop() ? sX : sY; }

function tickPhase(dt) {
  phaseT += dt;
  const peaks = currentPeaks();
  const s1 = spring1(), s2 = spring2();

  if (phase === 'HOLD') {
    if (phaseT >= HOLD_DUR) {
      setSpring(s1, 0.003, OC, ZC);
      phase = 'COLLAPSE1'; phaseT = 0;
    }
  } else if (phase === 'COLLAPSE1') {
    if (s1.pos < 0.01 || phaseT > 0.8) {
      // swap A <-> B (across s1 divider)
      const tmp = zoneWord[0]; zoneWord[0] = zoneWord[1]; zoneWord[1] = tmp;
      renderAssignment();
      setSpring(s1, S1_MID, OE, ZE);
      phase = 'EXPAND1'; phaseT = 0;
    }
  } else if (phase === 'EXPAND1') {
    if ((Math.abs(s1.pos - S1_MID) < 0.03 && Math.abs(s1.vel) < 0.08) || phaseT > 1.6) {
      setSpring(s2, 0.997, OC, ZC);
      phase = 'COLLAPSE2'; phaseT = 0;
    }
  } else if (phase === 'COLLAPSE2') {
    if (s2.pos > 0.99 || phaseT > 0.8) {
      // swap B <-> C (across s2 divider)
      const tmp = zoneWord[1]; zoneWord[1] = zoneWord[2]; zoneWord[2] = tmp;
      renderAssignment();
      const np = peaks[(stateIdx + 1) % 3];
      setSpring(sX, np.X, OE, ZE);
      setSpring(sY, np.Y, OE, ZE);
      phase = 'EXPAND2'; phaseT = 0;
    }
  } else if (phase === 'EXPAND2') {
    const np = peaks[(stateIdx + 1) % 3];
    const settled = Math.abs(sX.pos - np.X) < 0.01 && Math.abs(sY.pos - np.Y) < 0.01
                 && Math.abs(sX.vel) < 0.08 && Math.abs(sY.vel) < 0.08;
    if (settled || phaseT > 2.2) {
      sX.pos = np.X; sY.pos = np.Y;
      stateIdx = (stateIdx + 1) % 3;
      phase = 'HOLD'; phaseT = 0;
    }
  }
}

let lastNow = performance.now();
function frame(now) {
  const dt = (now - lastNow) / 1000;
  lastNow = now;

  const dtop = isDesktop();
  if (dtop !== lastDesktop) {
    lastDesktop = dtop;
    const p = currentPeaks()[stateIdx];
    sX.pos = p.X; sY.pos = p.Y; sX.vel = 0; sY.vel = 0;
    setSpring(sX, p.X, OE, ZE); setSpring(sY, p.Y, OE, ZE);
    phase = 'HOLD'; phaseT = 0;
  }

  tickPhase(dt);
  stepSpring(sX, dt);
  stepSpring(sY, dt);
  sX.pos = Math.min(0.998, Math.max(0.002, sX.pos));
  sY.pos = Math.min(0.998, Math.max(0.002, sY.pos));

  const zones = dtop ? layoutDesktop(sX.pos, sY.pos) : layoutMobile(sX.pos, sY.pos);
  applyLayout(zones);
}

(function loop(now){ try { frame(now); } catch(e){ console.error(e); } requestAnimationFrame(loop); })(performance.now());
