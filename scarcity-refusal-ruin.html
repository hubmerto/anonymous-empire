function vbWidth(vb){ return parseFloat(vb.split(/\s+/)[2]); }
const WORD_NAMES = ['SCARCITY','REFUSAL','RUIN'];

const SVGNS = 'http://www.w3.org/2000/svg';
function setWord(wordEl, wordName) {
  while (wordEl.firstChild) wordEl.removeChild(wordEl.firstChild);
  wordEl.dataset.word = wordName;
  const letters = WORDS[wordName];
  const widths = letters.map(c => vbWidth(GLYPHS[wordName][c].vb));
  const total = widths.reduce((a,b)=>a+b,0);
  letters.forEach((ch, i) => {
    const g = GLYPHS[wordName][ch];
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', g.vb);
    svg.setAttribute('preserveAspectRatio', 'none');
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', g.d);
    svg.appendChild(path);
    svg.style.width = (widths[i]/total*100) + '%';
    wordEl.appendChild(svg);
  });
}

// ---- cells tile the entire viewport (no gaps, no padding) ----
// cell 0 = TL, cell 1 = right full height, cell 2 = BL — cells 0+2 fill left column
function layout() {
  const W = innerWidth, H = innerHeight;
  const leftW = Math.round(W * 0.42);
  const topH  = Math.round(H * 0.30);
  const rects = [
    { L:0,     T:0,    W:leftW,   H:topH     },
    { L:leftW, T:0,    W:W-leftW, H:H        },
    { L:0,     T:topH, W:leftW,   H:H-topH   }
  ];
  for (let i = 0; i < 3; i++) {
    const c = document.getElementById('c'+i);
    const r = rects[i];
    c.style.left = r.L + 'px';
    c.style.top  = r.T + 'px';
    c.style.width  = r.W + 'px';
    c.style.height = r.H + 'px';
  }
}
layout();
addEventListener('resize', layout);

// ---- rotation: every CYCLE, each cell's word advances one step clockwise ----
// clockwise order of cells: 0 (TL) -> 1 (right) -> 2 (BL) -> 0
// If at state N, cell k shows WORD_NAMES[(k - N + 3*1000) % 3]
// (so as N increments, words move clockwise into next cell)
// Initial: cell 0 = SCARCITY, cell 1 = REFUSAL, cell 2 = RUIN
let state = 0;
function applyAssignment() {
  for (let k = 0; k < 3; k++) {
    const idx = (k - state + 3000) % 3;
    setWord(document.getElementById('w'+k), WORD_NAMES[idx]);
  }
}
applyAssignment();

// Distort animation: scale down on X axis then back up (with new content at midpoint).
// No fading, no overlap — cells always full, motion = non-uniform scale.
const HOLD_MS = 1500;
const MOVE_MS = 900;

function advance() {
  const words = [document.getElementById('w0'), document.getElementById('w1'), document.getElementById('w2')];
  // phase 1: crush each word to near-zero width (still in its cell)
  words.forEach(w => {
    w.style.transition = `transform ${MOVE_MS/2}ms cubic-bezier(.55,.05,.6,.2)`;
    w.style.transform = 'scaleX(0.02) scaleY(1.4)';
  });
  setTimeout(() => {
    // swap content while invisible (zero width)
    state++;
    applyAssignment();
    // phase 2: expand back out to full cell
    words.forEach(w => {
      w.style.transition = `transform ${MOVE_MS/2}ms cubic-bezier(.4,.8,.4,1)`;
      w.style.transform = 'scaleX(1) scaleY(1)';
    });
  }, MOVE_MS/2);
}

setInterval(advance, HOLD_MS + MOVE_MS);
