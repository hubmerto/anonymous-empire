<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Empire — Pile Loop</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative;
    width: min(70vmin, 720px);
    height: min(70vmin, 720px);
  }
  .c {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
    box-shadow: 0 18px 48px rgba(0,0,0,0.7);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script>
    // Fetch the cover filename list from data/releases.json so we use the real catalogue.
    (async function(){
      const stage = document.getElementById('stage');
      let covers = [];
      try {
        const r = await fetch('data/releases.json?v=' + Date.now());
        const d = await r.json();
        covers = d.releases.map(x => x.image).filter(Boolean);
      } catch (e) {
        // fallback to any window-exposed list
        if (window.ALL_COVERS) covers = window.ALL_COVERS.map(f => 'images/' + f);
      }
      if (!covers.length) return;

      // Shuffle for visual variety (optional — remove to play in catalogue order).
      for (let i = covers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [covers[i], covers[j]] = [covers[j], covers[i]];
      }

      const LOOP_MS = 20000; // total loop duration
      const total = covers.length;
      const INTERVAL = Math.max(8, Math.floor(LOOP_MS / total));

      // Preload everything so nothing stalls mid-loop.
      covers.forEach(src => { const im = new Image(); im.src = src; });

      function clearStage(){
        while (stage.firstChild) stage.removeChild(stage.firstChild);
      }

      function runLoop(){
        clearStage();
        let i = 0, z = 1;
        const id = setInterval(function(){
          if (i >= total){
            clearInterval(id);
            // Reshuffle and go again for variety.
            for (let k = covers.length - 1; k > 0; k--) {
              const j = Math.floor(Math.random() * (k + 1));
              [covers[k], covers[j]] = [covers[j], covers[k]];
            }
            runLoop();
            return;
          }
          const img = document.createElement('img');
          img.className = 'c';
          img.src = covers[i];
          img.style.zIndex = z++;
          stage.appendChild(img);
          i++;
        }, INTERVAL);
      }

      runLoop();
    })();
  </script>
</body>
</html>
